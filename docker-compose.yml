services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: redpanda_server
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --node-id 0
      - --check=false
      - --kafka-addr PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  app:
    build: ./quiz_app_streamlit
    container_name: quiz_producer_app
    command: ["app_quiz.py", "--server.port=8501", "--server.address=0.0.0.0"]
    environment:
      KAFKA_BROKER: redpanda:9092
    ports:
      - "8501:8501"
    depends_on:
      redpanda:
        condition: service_healthy